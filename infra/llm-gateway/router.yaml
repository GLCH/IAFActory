# Politique du routeur jev-router. `name` doit correspondre a un model_name de
# litellm.yaml.
#
# Jev (TypeSafe) est DESACTIVE : il ne s'active que si TYPESAFE_API_KEY est
# definie, ce que compose.yaml ne fait pas. Dans ce cas, un resume de la requete
# (jusqu'a 8 messages de 2000 caracteres) est envoye a api.typesafe.ai, un tiers.
# Ne l'activer que pour des charges sans document confidentiel (ADR 0004).
#
# Sans Jev, le routeur choisit le candidat eligible le MOINS CHER. Les prix n'etant
# pas renseignes (null), c'est le PREMIER de la liste : les candidats sont donc
# classes du moins cher au plus cher. A remplacer par les prix reels verifies
# avant tout usage de l'alias iaf-auto.
#
# `iaf-auto` reste un choix PARMI d'autres : le choix par defaut reste le choix
# explicite du modele par agent (US4.1). iaf-auto sert aux cas ou l'agent delegue
# le choix a la passerelle.

objective: quality_per_dollar
aliases: [iaf-auto]
fallback: claude-sonnet

jev:
  model: jev-latest
  timeout_ms: 5000

candidates:
  - name: ollama-local
    description: Modele local, sans cout d'API. Taches routinieres ou sensibles ou l'on prefere ne rien envoyer a un fournisseur externe.
    vision: false
    tools: true
    price_in: null
    price_out: null

  - name: claude-haiku
    description: Modele rapide et economique. Taches routinieres, extraction, reponses courtes sur texte.
    vision: false
    tools: true
    price_in: null
    price_out: null

  - name: gemini-flash
    description: Modele rapide chez Google. Alternative economique a claude-haiku, notamment pour le tres long contexte.
    vision: true
    tools: true
    price_in: null
    price_out: null

  - name: claude-sonnet
    description: Modele polyvalent. Bon defaut quand la qualite compte, raisonnement sur documents techniques.
    vision: false
    tools: true
    price_in: null
    price_out: null

  - name: gemini-pro
    description: Modele avance chez Google, tres long contexte. Alternative a claude-sonnet ou claude-opus selon le cout mesure.
    vision: true
    tools: true
    price_in: null
    price_out: null

  - name: claude-opus
    description: Modele le plus capable chez Anthropic. Reserve aux taches difficiles, a plusieurs etapes, ou l'erreur coute cher.
    vision: false
    tools: true
    price_in: null
    price_out: null
