# PIPELINE DESACTIVE (declenchement manuel uniquement, voir
# docs/runbooks/activer-les-pipelines.md). Pile retenue le 2026-09-27
# (ADR 0007) : site Python dans `site/`. Le runtime d'agents n'existe pas
# encore ; ce fichier se limite au site pour l'instant.
name: ci-app

on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : ces tests n'ouvrent aucune connexion Postgres reelle
      # (dependances FastAPI substituees), mais app/config.py exige ces champs
      # a l'import.
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      SESSION_SECRET: ci-secret-non-utilise-en-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./site[dev]"
      - run: pytest site/tests
